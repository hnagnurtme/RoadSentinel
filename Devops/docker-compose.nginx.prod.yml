services:
  backend:
    image: ${BACKEND_IMAGE:-roadsentinel-backend:latest}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_HOST: 0.0.0.0
      APP_PORT: ${APP_PORT:-8000}
      DATABASE_URL: ${DATABASE_URL}
      SQL_ECHO: ${SQL_ECHO:-false}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-https://example.com}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      CORS_ALLOW_METHODS: ${CORS_ALLOW_METHODS:-*}
      CORS_ALLOW_HEADERS: ${CORS_ALLOW_HEADERS:-*}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read()\""]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DOMAIN: ${DOMAIN}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_CONF_TEMPLATE:-./nginx/nginx.bootstrap.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - certbot_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    command: >
      /bin/sh -c "envsubst '$$DOMAIN $$RATE_LIMIT_RPS $$RATE_LIMIT_BURST'
      < /etc/nginx/templates/default.conf.template
      > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"

  certbot-init:
    image: certbot/certbot:latest
    profiles: ["init"]
    volumes:
      - certbot_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    command: >
      certonly --webroot --webroot-path=/var/www/certbot
      --email ${LETSENCRYPT_EMAIL}
      --agree-tos --no-eff-email --non-interactive --keep-until-expiring
      -d ${DOMAIN}

  certbot-renew:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    command: >
      /bin/sh -c "while :; do
      certbot renew --webroot --webroot-path=/var/www/certbot --quiet;
      sleep 12h;
      done"

volumes:
  certbot_webroot:
  letsencrypt:
