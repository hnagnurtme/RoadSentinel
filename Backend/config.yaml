app:
  name: RoadSentinel Backend
  env: development
  host: 127.0.0.1
  port: 8000
  public_base_url: http://127.0.0.1:8000

sql_echo: false

cors_allow_origins:
  - http://localhost:3000
  - http://127.0.0.1:3000
cors_allow_credentials: true
cors_allow_methods:
  - "*"
cors_allow_headers:
  - "*"

driver_event:

  # ── Temporal Reasoning ──────────────────────────────────────────────
  temporal:
    tracked_events: [sleeping, drowsy, using_phone, distracted]
    confidence_gates:
      sleeping:    0.45
      drowsy:      0.50
      using_phone: 0.55
      distracted:  0.55
    # EWMA alpha pairs — rise fast / fall slow for critical events
    alpha_rise:
      sleeping:    0.50
      drowsy:      0.30
      using_phone: 0.40
      distracted:  0.25
    alpha_fall:
      sleeping:    0.10   # very slow release — safety critical
      drowsy:      0.12
      using_phone: 0.15
      distracted:  0.30   # fast release — brief glances are normal
    dropout:
      max_hold_seconds: 1.5
      decay_half_life:  2.0

  # ── State Machine ────────────────────────────────────────────────────
  state_machine:
    unknown_enter_seconds: 5.0
    exit_hold_seconds: 3.0          # prevent rapid state drops
    priority_order: [sleeping, using_phone, distracted, drowsy]
    event_enter_thresholds:
      sleeping:    0.55
      drowsy:      0.50
      using_phone: 0.52
      distracted:  0.48
    event_exit_thresholds:
      sleeping:    0.30
      drowsy:      0.28
      using_phone:  0.30
      distracted:  0.25
    # Seconds in DANGEROUS state before escalating to CRITICAL
    critical_duration_seconds:
      sleeping:    5.0    # 5 seconds sleeping = CRITICAL immediately
      using_phone: 10.0
      distracted: 20.0
    drowsy_escalation_seconds: 30.0  # drowsy for 30s → DANGEROUS

  # ── Alert Decision ───────────────────────────────────────────────────
  alert:
    require_identified_driver: false  # set true in production
    min_stable_seconds:
      sleeping:    0.0    # immediate
      using_phone: 2.0
      distracted: 3.0
      drowsy:      5.0
    cooldown_seconds:
      sleeping:    60.0
      using_phone: 45.0
      distracted: 30.0
      drowsy:      120.0

  # ── Evidence ─────────────────────────────────────────────────────────
  evidence:
    enabled: true
    fps: 5
    pre_event_seconds: 3    # capture onset
    post_event_seconds: 7   # capture peak + resolution
    codec: mp4v
    codec_candidates: [avc1, H264, mp4v]
    keep_local_after_upload: false
    # Only save evidence for WARNING and CRITICAL
    min_severity_for_evidence: WARNING

  # ── Cloudinary ───────────────────────────────────────────────────────
  cloudinary:
    enabled: true
    cloud_name: dks1edqey
    folder: roadsentinel/evidence
    # api_key and api_secret MUST be set in .env — never here

  # ── Device / Session ─────────────────────────────────────────────────
  # These are resolved dynamically from the WebSocket handshake.
  # The static UUIDs below are ONLY used as fallback in development.
  fallback_device_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
  fallback_driver_id: 1edc79dd-1331-454e-b64d-12fb8e77f464   # null = no fallback; require handshake
  fallback_vehicle_id: 0e225dd7-deba-4cfa-91ef-dfa30a3942d1
