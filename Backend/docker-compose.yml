services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_AI: ${WITH_AI:-false}
    image: ${BACKEND_IMAGE:-roadsentinel-backend:local}
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: 0.0.0.0
      APP_PORT: ${APP_PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/roadsentinel}
      SQL_ECHO: ${SQL_ECHO:-false}
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read()\""]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backend_data:
