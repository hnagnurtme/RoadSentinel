version: 2.1

executors:
  python-executor:
    docker:
      - image: cimg/python:3.13

jobs:
  backend_ci:
    executor: python-executor
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-pip-backend-{{ checksum "Backend/requirements.txt" }}
            - v1-pip-backend-
      - run:
          name: Install Backend dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r Backend/requirements.txt
      - save_cache:
          key: v1-pip-backend-{{ checksum "Backend/requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Static checks and app import
          command: |
            python -m compileall Backend
            cd Backend
            python -c "from main import app; print(app.title)"
      - run:
          name: Run Backend tests (if present)
          command: |
            if [ -d Backend/tests ]; then
              pip install pytest
              pytest Backend/tests -q
            else
              echo "No Backend tests found, skipping."
            fi

  docker_build_and_push:
    docker:
      - image: cimg/base:stable
    working_directory: ~/project
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build and push Backend image
          command: |
            if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_PASSWORD" ]; then
              echo "DOCKERHUB_USERNAME/DOCKERHUB_PASSWORD must be set in CircleCI project settings."
              exit 1
            fi

            IMAGE_NAME="$DOCKERHUB_USERNAME/roadsentinel-backend"
            TAG="${CIRCLE_TAG:-${CIRCLE_SHA1:0:7}}"

            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker build -f Backend/Dockerfile -t "$IMAGE_NAME:$TAG" Backend
            docker push "$IMAGE_NAME:$TAG"

            if [ "$CIRCLE_BRANCH" = "main" ]; then
              docker tag "$IMAGE_NAME:$TAG" "$IMAGE_NAME:latest"
              docker push "$IMAGE_NAME:latest"
            fi

  deploy_backend_vps:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - add_ssh_keys
      - run:
          name: Deploy Backend on VPS via SSH
          command: |
            if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$DEPLOY_PATH" ]; then
              echo "VPS_HOST, VPS_USER, DEPLOY_PATH must be set in CircleCI project settings."
              exit 1
            fi

            SSH_PORT="${VPS_SSH_PORT:-22}"
            LOCAL_COMPOSE_FILE="${COMPOSE_SOURCE_FILE:-Devops/docker-compose.nginx.prod.yml}"
            REMOTE_COMPOSE_FILE="${DEPLOY_COMPOSE_FILE:-docker-compose.nginx.prod.yml}"
            LOCAL_ENV_FILE="/tmp/backend.deploy.env"
            REMOTE_ENV_FILE="${DEPLOY_ENV_FILE:-.env}"
            LOCAL_NGINX_DIR="${NGINX_SOURCE_DIR:-Devops/nginx}"
            REMOTE_NGINX_DIR="${DEPLOY_NGINX_DIR:-nginx}"
            BACKEND_IMAGE="${DOCKERHUB_USERNAME}/roadsentinel-backend:${CIRCLE_TAG:-latest}"

            if [ ! -f "$LOCAL_COMPOSE_FILE" ]; then
              echo "Compose source file not found in CI workspace: $LOCAL_COMPOSE_FILE"
              exit 1
            fi

            if [ -z "$DATABASE_URL" ]; then
              echo "DATABASE_URL must be set in CircleCI project settings/context for deploy."
              exit 1
            fi
            if [ -z "$DOMAIN" ] || [ -z "$LETSENCRYPT_EMAIL" ]; then
              echo "DOMAIN and LETSENCRYPT_EMAIL must be set in CircleCI project settings/context for deploy."
              exit 1
            fi
            if [ ! -f "$LOCAL_NGINX_DIR/nginx.bootstrap.conf.template" ] || [ ! -f "$LOCAL_NGINX_DIR/nginx.conf.template" ]; then
              echo "Nginx template files not found in CI workspace: $LOCAL_NGINX_DIR"
              exit 1
            fi

            {
              printf 'APP_ENV=%s\n' "${APP_ENV:-production}"
              printf 'APP_HOST=%s\n' "${APP_HOST:-0.0.0.0}"
              printf 'APP_PORT=%s\n' "${APP_PORT:-8000}"
              printf 'DATABASE_URL=%s\n' "${DATABASE_URL}"
              printf 'SQL_ECHO=%s\n' "${SQL_ECHO:-false}"
              printf 'CORS_ALLOW_ORIGINS=%s\n' "${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
              printf 'CORS_ALLOW_CREDENTIALS=%s\n' "${CORS_ALLOW_CREDENTIALS:-true}"
              printf 'CORS_ALLOW_METHODS=%s\n' "${CORS_ALLOW_METHODS:-*}"
              printf 'CORS_ALLOW_HEADERS=%s\n' "${CORS_ALLOW_HEADERS:-*}"
              printf 'DOMAIN=%s\n' "${DOMAIN}"
              printf 'LETSENCRYPT_EMAIL=%s\n' "${LETSENCRYPT_EMAIL}"
              printf 'RATE_LIMIT_RPS=%s\n' "${RATE_LIMIT_RPS:-20}"
              printf 'RATE_LIMIT_BURST=%s\n' "${RATE_LIMIT_BURST:-40}"
              printf 'NGINX_CONF_TEMPLATE=%s\n' "./$REMOTE_NGINX_DIR/nginx.bootstrap.conf.template"
            } > "$LOCAL_ENV_FILE"

            mkdir -p ~/.ssh
            ssh-keyscan -p "$SSH_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

            ssh -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" "DEPLOY_PATH='$DEPLOY_PATH' REMOTE_COMPOSE_FILE='$REMOTE_COMPOSE_FILE' REMOTE_ENV_FILE='$REMOTE_ENV_FILE' REMOTE_NGINX_DIR='$REMOTE_NGINX_DIR' BACKEND_IMAGE='$BACKEND_IMAGE' bash -lc '
            set -e
            mkdir -p \"\$DEPLOY_PATH\" \"\$(dirname \"\$DEPLOY_PATH/\$REMOTE_COMPOSE_FILE\")\" \"\$(dirname \"\$DEPLOY_PATH/\$REMOTE_ENV_FILE\")\" \"\$DEPLOY_PATH/\$REMOTE_NGINX_DIR\"
            '"

            scp -P "$SSH_PORT" "$LOCAL_COMPOSE_FILE" "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/$REMOTE_COMPOSE_FILE"
            scp -P "$SSH_PORT" "$LOCAL_ENV_FILE" "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/$REMOTE_ENV_FILE"
            scp -P "$SSH_PORT" "$LOCAL_NGINX_DIR/nginx.bootstrap.conf.template" "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/$REMOTE_NGINX_DIR/nginx.bootstrap.conf.template"
            scp -P "$SSH_PORT" "$LOCAL_NGINX_DIR/nginx.conf.template" "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/$REMOTE_NGINX_DIR/nginx.conf.template"

            ssh -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" "DEPLOY_PATH='$DEPLOY_PATH' REMOTE_COMPOSE_FILE='$REMOTE_COMPOSE_FILE' REMOTE_ENV_FILE='$REMOTE_ENV_FILE' REMOTE_NGINX_DIR='$REMOTE_NGINX_DIR' BACKEND_IMAGE='$BACKEND_IMAGE' bash -lc '
            set -e
            export PATH=\"\$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin\"

            if command -v docker >/dev/null 2>&1; then
              DOCKER_CMD=\"docker\"
            elif [ -x /usr/bin/docker ]; then
              DOCKER_CMD=\"/usr/bin/docker\"
            elif [ -x /snap/bin/docker ]; then
              DOCKER_CMD=\"/snap/bin/docker\"
            elif command -v sudo >/dev/null 2>&1 && sudo -n command -v docker >/dev/null 2>&1; then
              DOCKER_CMD=\"sudo docker\"
            elif command -v sudo >/dev/null 2>&1 && [ -x /usr/bin/docker ]; then
              DOCKER_CMD=\"sudo /usr/bin/docker\"
            elif command -v sudo >/dev/null 2>&1 && [ -x /snap/bin/docker ]; then
              DOCKER_CMD=\"sudo /snap/bin/docker\"
            else
              echo \"Docker is not installed or not available in PATH on VPS.\"
              echo \"Install Docker and ensure deploy user can run it (docker group or passwordless sudo).\"
              exit 1
            fi

            if \$DOCKER_CMD compose version >/dev/null 2>&1; then
              COMPOSE_CMD=\"\$DOCKER_CMD compose\"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD=\"docker-compose\"
            elif [ -x /usr/bin/docker-compose ]; then
              COMPOSE_CMD=\"/usr/bin/docker-compose\"
            elif command -v sudo >/dev/null 2>&1 && sudo -n command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD=\"sudo docker-compose\"
            elif command -v sudo >/dev/null 2>&1 && [ -x /usr/bin/docker-compose ]; then
              COMPOSE_CMD=\"sudo /usr/bin/docker-compose\"
            else
              echo \"Docker Compose is not available on VPS (docker compose plugin or docker-compose binary).\"
              exit 1
            fi

            cd \"\$DEPLOY_PATH\"
            if [ ! -f \"\$REMOTE_COMPOSE_FILE\" ]; then
              echo \"Copied compose file not found: \$DEPLOY_PATH/\$REMOTE_COMPOSE_FILE\"
              exit 1
            fi
            if [ ! -f \"\$REMOTE_ENV_FILE\" ]; then
              echo \"Copied env file not found: \$DEPLOY_PATH/\$REMOTE_ENV_FILE\"
              exit 1
            fi
            if [ ! -f \"\$REMOTE_NGINX_DIR/nginx.bootstrap.conf.template\" ] || [ ! -f \"\$REMOTE_NGINX_DIR/nginx.conf.template\" ]; then
              echo \"Copied nginx templates not found in: \$DEPLOY_PATH/\$REMOTE_NGINX_DIR\"
              exit 1
            fi

            BACKEND_IMAGE=\"\$BACKEND_IMAGE\" \$COMPOSE_CMD -f \"\$REMOTE_COMPOSE_FILE\" pull backend
            BACKEND_IMAGE=\"\$BACKEND_IMAGE\" \$COMPOSE_CMD -f \"\$REMOTE_COMPOSE_FILE\" up -d backend nginx
            BACKEND_IMAGE=\"\$BACKEND_IMAGE\" \$COMPOSE_CMD -f \"\$REMOTE_COMPOSE_FILE\" --profile init run --rm certbot-init
            NGINX_CONF_TEMPLATE=\"./\$REMOTE_NGINX_DIR/nginx.conf.template\" BACKEND_IMAGE=\"\$BACKEND_IMAGE\" \$COMPOSE_CMD -f \"\$REMOTE_COMPOSE_FILE\" up -d nginx certbot-renew
            '"

  preflight_backend_vps:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - add_ssh_keys
      - run:
          name: Preflight VPS readiness checks
          command: |
            if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$DEPLOY_PATH" ]; then
              echo "VPS_HOST, VPS_USER, DEPLOY_PATH must be set in CircleCI project settings."
              exit 1
            fi

            SSH_PORT="${VPS_SSH_PORT:-22}"
            LOCAL_COMPOSE_FILE="${COMPOSE_SOURCE_FILE:-Devops/docker-compose.nginx.prod.yml}"
            REMOTE_COMPOSE_FILE="${DEPLOY_COMPOSE_FILE:-docker-compose.nginx.prod.yml}"
            LOCAL_NGINX_DIR="${NGINX_SOURCE_DIR:-Devops/nginx}"
            REMOTE_NGINX_DIR="${DEPLOY_NGINX_DIR:-nginx}"

            if [ ! -f "$LOCAL_COMPOSE_FILE" ]; then
              echo "Compose source file not found in CI workspace: $LOCAL_COMPOSE_FILE"
              exit 1
            fi
            if [ ! -f "$LOCAL_NGINX_DIR/nginx.bootstrap.conf.template" ] || [ ! -f "$LOCAL_NGINX_DIR/nginx.conf.template" ]; then
              echo "Nginx template files not found in CI workspace: $LOCAL_NGINX_DIR"
              exit 1
            fi
            if [ -z "$DOMAIN" ] || [ -z "$LETSENCRYPT_EMAIL" ]; then
              echo "DOMAIN and LETSENCRYPT_EMAIL must be set in CircleCI project settings/context for deploy."
              exit 1
            fi

            mkdir -p ~/.ssh
            ssh-keyscan -p "$SSH_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

            ssh -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" "DEPLOY_PATH='$DEPLOY_PATH' REMOTE_COMPOSE_FILE='$REMOTE_COMPOSE_FILE' REMOTE_NGINX_DIR='$REMOTE_NGINX_DIR' bash -lc '
            set -e
            export PATH=\"\$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin\"

            echo \"Checking Docker availability...\"
            if command -v docker >/dev/null 2>&1; then
              DOCKER_CMD=\"docker\"
            elif [ -x /usr/bin/docker ]; then
              DOCKER_CMD=\"/usr/bin/docker\"
            elif [ -x /snap/bin/docker ]; then
              DOCKER_CMD=\"/snap/bin/docker\"
            elif command -v sudo >/dev/null 2>&1 && sudo -n command -v docker >/dev/null 2>&1; then
              DOCKER_CMD=\"sudo docker\"
            elif command -v sudo >/dev/null 2>&1 && [ -x /usr/bin/docker ]; then
              DOCKER_CMD=\"sudo /usr/bin/docker\"
            elif command -v sudo >/dev/null 2>&1 && [ -x /snap/bin/docker ]; then
              DOCKER_CMD=\"sudo /snap/bin/docker\"
            else
              echo \"Docker is not installed or not available in PATH on VPS.\"
              exit 1
            fi
            \$DOCKER_CMD --version

            echo \"Checking Docker Compose availability...\"
            if \$DOCKER_CMD compose version >/dev/null 2>&1; then
              COMPOSE_CMD=\"\$DOCKER_CMD compose\"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD=\"docker-compose\"
            elif [ -x /usr/bin/docker-compose ]; then
              COMPOSE_CMD=\"/usr/bin/docker-compose\"
            elif command -v sudo >/dev/null 2>&1 && sudo -n command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD=\"sudo docker-compose\"
            elif command -v sudo >/dev/null 2>&1 && [ -x /usr/bin/docker-compose ]; then
              COMPOSE_CMD=\"sudo /usr/bin/docker-compose\"
            else
              echo \"Docker Compose is not available on VPS (docker compose plugin or docker-compose binary).\"
              exit 1
            fi
            \$COMPOSE_CMD version

            echo \"Checking deploy path and compose file...\"
            if [ ! -d \"\$DEPLOY_PATH\" ]; then
              echo \"DEPLOY_PATH does not exist: \$DEPLOY_PATH\"
              exit 1
            fi

            cd \"\$DEPLOY_PATH\"
            echo \"Compose file will be uploaded to: \$DEPLOY_PATH/\$REMOTE_COMPOSE_FILE\"
            echo \"Nginx templates will be uploaded to: \$DEPLOY_PATH/\$REMOTE_NGINX_DIR\"

            echo \"VPS preflight checks passed.\"
            '"

workflows:
  ci_cd:
    jobs:
      - backend_ci:
          filters:
            branches:
              only: /.*/
            tags:
              only: /.*/
      - docker_build_and_push:
          name: docker_build_and_push_main
          requires:
            - backend_ci
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/
      - docker_build_and_push:
          name: docker_build_and_push_tag
          requires:
            - backend_ci
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
      - preflight_backend_vps:
          requires:
            - docker_build_and_push_tag
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
      - deploy_backend_vps:
          requires:
            - preflight_backend_vps
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
